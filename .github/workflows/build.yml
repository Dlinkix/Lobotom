name: Сборка Unity Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:windows-mono-6000.3.3f1

    steps:
      - uses: actions/checkout@v4

      - name: Кэширование Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Сборка Windows билда
        run: |
          /opt/unity/Editor/Unity \
            -quit \
            -batchmode \
            -nographics \
            -projectPath . \
            -buildWindows64Player build/MyGame.exe \
            -logFile build.log
          cat build.log

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-Windows
          path: build/