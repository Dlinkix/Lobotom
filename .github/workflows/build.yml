name: Сборка Unity Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-setup@v2
        with:
          unityVersion: 6000.3.3f1
          modules: windows  

      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneWindows64  
          buildName: MyGame
          buildsPath: build

      - uses: actions/upload-artifact@v4
        with:
          name: MyGame-Windows
          path: build/StandaloneWindows64/*.exe  