name: Unity Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 6000.3.3f1
          buildMethod: Lobotom.Build.Editor.BuildCommand.BuildWindows64
          buildsPath: build
          allowDirtyBuild: true

      - name: Copy to Build folder
        run: |
          mkdir -p Build
          cp -r build/StandaloneWindows64/* Build/

      - name: Commit and push Build folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Build/
          git diff --staged --quiet || git commit -m "Обновление билда [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: Lobotom-Windows
          path: build/StandaloneWindows64/