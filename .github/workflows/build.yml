name: Сборка Unity Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Установка Unity
        uses: jlpm/unity-setup@v1
        with:
          unity-version: 6000.3.3f1
          target-platforms: standalone

      - name: Сборка проекта
        uses: jlpm/unity-builder@v1
        with:
          unity-version: 6000.3.3f1
          target-platform: StandaloneWindows64
          build-name: MyGame
          build-path: build

      - uses: actions/upload-artifact@v4
        with:
          name: MyGame-Windows
          path: build/StandaloneWindows64/